[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers --cov=src --cov-report=term-missing --cov-report=json:coverage/coverage-summary.json --cov-fail-under=80
testpaths =
    tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, pure in-memory)
    integration: Integration tests (database, adapters)
    e2e: End-to-end user journey tests
    perf: Performance and benchmark tests
    regression: Regression invariant tests
